# Builds every episode and publishes the series to GitHub Pages:
#   /                      the landing page in site/
#   /<episode-folder>/     each episode's production build
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the landing page and every episode
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          for dir in episodes/*/; do
            name="$(basename "$dir")"
            if [ ! -f "$dir/package.json" ]; then continue; fi
            echo "::group::$name"
            (cd "$dir" && npm ci --no-fund --no-audit && npm test && npm run build)
            cp -r "$dir/dist" "_site/$name"
            echo "::endgroup::"
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
